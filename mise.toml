
[env]
FLATE_PATH = "{{config_root}}/kubernetes/apps"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/_out/talosconfig"

[tools]
# Kubectl + Tools + Plugins
"aqua:kubectl" = "1.37.1"
"github:mirceanton/kubectl-switch" = "2.4.35"
"github:josegonzalez/kubectl-eso" = "0.5.0"
"github:cloudnative-pg/cloudnative-pg" = "1.30.1"
"aqua:kustomize" = "5.8.3"
sofka = "0.33.0"

# Flux Tools
"aqua:fluxcd/flux2" = "2.10.0"
"github:home-operations/flate" = "0.6.5"

# Helm + Plugins
"aqua:helm" = "4.3.1"
helmfile = "1.8.2"

# Talos Stuff
"aqua:talosctl" = "1.14.5"
"github:mirceanton/talstomize" = "1.0.1"
"github:mirceanton/talswitcher" = "2.2.42"

# Misc Tools
just = "1.59.0"
sops = "3.13.3"
age = "1.3.2"
yq = "4.54.1"
krew = "0.5.0"

[settings]
# Hold back freshly published tool releases (supply-chain protection).
minimum_release_age = "3d"
