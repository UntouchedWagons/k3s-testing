# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  hostnames:
    - flux.${CLUSTER_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: flux-operator
        namespace: flux-system
        port: 9080
        weight: 1
      matches:
      - path:
          type: PathPrefix
          value: /
