# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volsync
spec:
  jobLabel: volsync
  endpoints:
    - port: https
      path: /metrics
      honorLabels: true
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
  namespaceSelector:
    matchNames:
      - volsync
  selector:
    matchLabels:
      app.kubernetes.io/instance: volsync
