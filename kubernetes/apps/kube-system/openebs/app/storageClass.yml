# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/storage.k8s.io/storageclass_v1.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: host-zfs-standard
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: zfs.csi.openebs.io
allowVolumeExpansion: true
parameters:
  recordsize: "16k"
  compression: "lz4"
  dedup: "off"
  fstype: "zfs"
  poolname: "zfspv-pool"
# Use allowedTopologies: in case ZFS is only available
# on some of the nodes in the cluster.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/snapshot.storage.k8s.io/volumesnapshotclass_v1.json
kind: VolumeSnapshotClass
apiVersion: snapshot.storage.k8s.io/v1
metadata:
  name: host-zfs-snapshot
driver: zfs.csi.openebs.io
deletionPolicy: Delete
