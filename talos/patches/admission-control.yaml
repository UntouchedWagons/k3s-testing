apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity # Admission control plugin name, should be a valid Kubernetes admission control plugin name.
# Kubernetes API server [admission control plugins](https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/).
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  defaults:
    audit: privileged
    audit-version: latest
    enforce: privileged
    enforce-version: latest
    warn: privileged
    warn-version: latest
  # This is intentionally commented out, otherwise the kube-system namespace
  # will be exempted twice which causes issues for bootstrapping Talos
  # exemptions:
  #   namespaces:
  #     - kube-system
  #   runtimeClasses: []
  #   usernames: []
  kind: PodSecurityConfiguration
